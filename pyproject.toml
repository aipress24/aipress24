    # Used to run a development server
    "honcho>=2,<3",
    # Code generation
    "buildstr<1.0.0,>=0.1.1",
    # Debug helpers (optional at runtime — app falls back to `print`)
    "devtools<1.0.0,>=0.12.2",
    "snoop<1.0,>=0.6",
    # Fake data generation (used only by `flask fake` and tests)
    "faker>=30",
    "mimesis>=18",
    # Main QA tools
    "abilian-devtools<1.0,>=0.7",
    "flask-debugtoolbar<1.0,>=0.16",
    # (Remove?)
    #    "openpyxl<4.0.0,>=3.1.2",
    #    "pijnu==20160727",
    # More flake8 plugins
    "flake8-requirements<3.0.0,>=2.0.1",
    "flake8-use-pathlib<1.0.0,>=0.3.0",
    "flake8-ecocode",
    # Linters and type-checkers
    "auto-type-annotate>=1.1.2",
    "ty>=0.0.0a7",
    "pyrefly>=0.32.0",
    "monkeytype>=23.3.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    # Typing extensions
    "types-bleach",
    "types-chardet",
    "types-deprecated",
    "types-markdown",
    "types-python-slugify",
    "types-pytz",
    "types-pyyaml",
    "types-requests",
    # Must be pinned for now (version 82 breaks some packages)
    "types-setuptools>=81,<82",
    "types-toml",
    # More linters / typecheckers / tools
    "import-linter<3.0,>=2.0",
    "typeguard<5.0,>=4.1",
    "pip-licenses<6,>=5",
    "pyupgrade<4.0.0,>=3.15.0",
    "tomlkit>=0.13,<1.0",
    "deptry>=0.20",
    "infer-types<2.0.0,>=1.0.0",
    "flynt<2.0.0,>=1.0.1",
    # Testing & automation
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-rerunfailures>=16.1",
    "pytest-minio-mock",
    "pytest-mock>=3.15.0",
    "pytest-flask<2.0.0,>=1.3.0",
    "pytest-custom-exit-code<1.0.0,>=0.3.0",
    "pytest-split<1.0,>=0.10",
    "pytest-archon<1.0.0,>=0.0.6",
    "pytest-testmon<3.0.0,>=2.1.0",
    "pytest-watcher<1.0,>=0.4",
    "hypothesis",
    "nox",
    "invoke>=2.2.0",
    # Coverage
    "coverage[toml]<8.0.0,>=7.4.0",
    "flask-coverage>=0.1.0 ; python_full_version >= '3.12'",
    # e2e and cucumber tests
    "playwright",
    "pytest-playwright",
    "selenium",
    "behave",
    "cssselect",
    # Misc
    "responses>=0.25.8",
    "httpx>=0.28.1",
    "sqlalchemy-data-model-visualizer<1.0.0,>=0.1.3",
    "git-filter-repo>=2.47.0",
    "pytest-randomly>=4.1.0",
    "tepyd>=0.5.0",
    "pyright>=1.1.411",
    "zuban>=0.9.0",
