    "webbits<1.0.0,>=0.1.2",
    # Generic Libs
    "arrow<2.0.0,>=1.3.0",
    "attrs<27,>=26",
    "boltons<26,>=25",
    "pipe<3.0,>=2.1",
    "python-slugify<9.0.0,>=8.0.1",
    "toml<1.0.0,>=0.10.2",
    "tomli<3.0.0,>=2.0.1",
    "loguru<1.0.0,>=0.7.2",
    "markdown<4.0.0,>=3.5.2",
