[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm.build]
includes = ["src/app", "src/adminapp", "src/server"]
excludes = ["**/test_*.py", "**/*_test.py", "**/tests.py"]


# -----------------------------------------------------------------------------

[tool.pytest]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
    "--disable-warnings",
    "--disable-pytest-warnings",
    "--ignore=src/app/sandbox/",
    "--ignore=src/app/dramatiq/worker_entry.py",
    "--tb=short",
    "--doctest-modules",
    # pytest-randomly is installed but disabled by default so CI runs in
    # collection order. Opt-in for an ad-hoc shuffle :
    #   uv run pytest -p randomly tests/a_unit            # shuffle once
    #   uv run pytest -p randomly --randomly-seed=12345   # reproduce a seed
    "-p", "no:randomly",
]
filterwarnings = [
    'ignore:.*contextfunction.*:DeprecationWarning',
    'ignore:.*Unmanaged.*:sqlalchemy.exc.SAWarning',
]
testpaths = ["tests", "src"]

# -----------------------------------------------------------------------------

[tool.pyanalyze]
paths = ["src/"]
import_paths = ["."]


# -----------------------------------------------------------------------------

[tool.deptry.per_rule_ignores]
# X defined as a dependency but not used in the codebase
DEP002 = [
    # Used (implicitely) by Flask-Login (I think)
    'zxcvbn',
    'bcrypt',
    'argon2-cffi',
    # libpass provides the `passlib` import namespace, so deptry sees
    # the distribution as "unused".
    'libpass',
    # Used (implicitely) by Flask (I think)
    'python-dotenv',
    # Used (implicitely) by SQLA
    'psycopg2',
    "asyncpg",
    #
    'python-iso639',
    # Web server
    'gunicorn',
    'honcho',
    # Used as a script
    'shot-scraper',
    # Used during install
    'nodeenv',
    # ???
    'case-convert',
    'defusedxml',
    # Not used (yet?)
    'phonenumbers',
    'jinja2-fragments',
    'pluggy',
    # Used by the WTForms
    'email-validator',
    'dnspython',
    # Used by a script
    'buildstr',
    # Used by hyperdx
    #    'hyperdx-opentelemetry',
    # Used in production
    'sentry-sdk',
    # Used by odsparsator
    'odfdo',
    # Used by 'flask packages'
    'setuptools',
    # Used by ODS export
    'pyexcel-ods3',
    # Used by blob storage
    'fsspec',
    's3fs',
]

# X imported but declared as a dev dependency
DEP004 = ['hypothesis', 'openpyxl', "flask_debugtoolbar"]

# -----------------------------------------------------------------------------

[tool.pyright]
include = ["src"]
exclude = [
    '.nox',
    'tests',
    'sandbox',
    'doc',
    'scripts',
    'tmp',
    "src/app/modules/superadmin",
]

# False positives
reportPrivateImportUsage = false
reportFunctionMemberAccess = false

# Enable later
reportGeneralTypeIssues = false
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false

# -----------------------------------------------------------------------------

[tool.ty.environment]
# The standalone API SDK lives outside src/; add it to the import search path
# so ty can resolve `aipress24_client` (its test inserts this at runtime).
extra-paths = ["sdk/python"]

[tool.ty.src]
exclude = [
    "tests-e2e/**/*.py",
    "scripts/**/*.py",
    "icons/**/*.py",
    "*.py",
    # FIXME later
    "src/app/modules/kyc/**/*.py",
]

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"

# -----------------------------------------------------------------------------

[tool.pyrefly]
project-includes = ["src", "tests"]
# Extra module-resolution roots (pytest adds these to sys.path at runtime;
# pyrefly needs them told explicitly):
#  - "." so `tests.*` absolute imports resolve
#    (`from tests.c_e2e.conftest import make_authenticated_client`);
#  - "sdk/python" so the standalone SDK (`aipress24_client`, `generate`) resolves
#    in its tests (mirrors `[tool.ty] extra-paths`).
search-path = [".", "sdk/python"]
project-excludes = [
    ".nox",
    "sandbox",
    "doc",
    "scripts",
    "tmp",
]
infer-with-first-use = false

[tool.pyrefly.errors]
bad-override = "ignore"
bad-argument-type = "ignore"   # SQLAlchemy InstrumentedAttribute false positives
bad-return = "ignore"
bad-assignment = "ignore"
missing-attribute = "ignore"
# `property.fget`/`.fset` are typed `Callable | None` in typeshed, so calling a
# getter directly (`Model.some_prop.fget(stub)` — a common pattern in the model
# unit tests) trips this. Every occurrence in this codebase is that idiom.
not-callable = "ignore"
# Pyrefly has no SQLAlchemy support, so instance attribute access on a mapped
# column (`org.name`, `model.titre`) is typed as `InstrumentedAttribute[str]`
# rather than `str`. In a membership test (`model.name in rendered_html`) that
# surfaces here. Every occurrence is that false positive (see also the
# InstrumentedAttribute note on bad-argument-type above).
unsupported-operation = "ignore"

# -----------------------------------------------------------------------------

[tool.zuban]
# strict = true
# disallow_untyped_defs = true
# warn_unreachable = true
# allow_untyped_globals = false
# check_untyped_defs = false
# follow_untyped_imports = true
exclude_gitignore = true

# -----------------------------------------------------------------------------

[tool.vulture]
ignore_decorators = ["@blueprint.before_request", "@expose"]

exclude = ["src/app/models/geo.py"]
#ignore_names = ["visit_*", "do_*"]
#make_whitelist = true
#min_confidence = 80
#paths = ["myscript.py", "mydir"]
#sort_by_size = true
#verbose = true

# -----------------------------------------------------------------------------

[tool.bandit]
skips = [
    "B404", # blacklist
    "B603", # subprocess_without_shell_equals_true
    "B101", # assert_used
    # FIXME later
    "B311", # blacklist
]

exclude_dirs = [
    "tests",
    "src/app/flask/cli/bootstrap.py",
    "src/app/faker",
    "conftest.py",
]

# -----------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/app"]
omit = [
    "tests/*.py",
    "**/test*.py",
    "**/*test.py",
    "src/app/faker/**/*.py",
]

[tool.coverage.report]
# show_missing = true
exclude_lines = [
    'pragma: no cover',
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]
skip_covered = true
skip_empty = true

[tool.coverage.html]
show_contexts = true

# -----------------------------------------------------------------------------

[tool.tepyd]
src_root = "src/app"
src_package = "app"
units = ["modules/*", "*"]   # 27-unit granularity — correct for mass/cover
shared = ["models", "settings"]   # never count as leaks

[tool.tepyd.exclude]
faker = "fake-data generators for seeding/tests — not production behaviour"
"modules/tests" = "test/demo routes (views.py only), not a real feature module"

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.5   # see note — 0.6 is unrealistic for a UI-heavy app

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"

[[tool.tepyd.tiers]]
name = "c_e2e"
root = "tests/c_e2e"
label = "http-e2e"

