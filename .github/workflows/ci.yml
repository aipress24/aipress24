name: CI (nox)

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install uv and nox
              run: pip install uv nox
            - name: Run checks (lint, format, typecheck)
              run: nox -s check

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install uv and nox
              run: pip install uv nox
            - name: Run tests
              run: nox -s test -p ${{ matrix.python-version }}

    # The suite against PostgreSQL, database and tests both in Docker
    # (see tests/docker/README.md).
    test-postgres:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - name: Run tests against PostgreSQL
              run: make test-postgres-docker

    build:
        runs-on: ubuntu-latest
        needs: [check, test, test-postgres]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install uv
              run: pip install uv
            - name: Build package
              run: uv build
