[project]
name = "aipress24-client"
version = "0.1.0"
description = "Dependency-free Python client for the AIpress24 public API (/api/v1)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipress24_client"]
