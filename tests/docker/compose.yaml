# Run the test suite against PostgreSQL, all in containers.
# See README.md.

services:
  # The data lives in an anonymous volume that `down -v` removes. It peaks
  # around 400 MB, too much for tmpfs on a small CI VM; with fsync off, disk
  # costs no speed, and a crash only loses a throwaway database.
  postgres:
    image: postgres:16
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: aipress24
      POSTGRES_PASSWORD: aipress24
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aipress24"]
      interval: 2s
      retries: 30

  tests-postgres:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    image: aipress24-tests
    environment:
      # The test session creates and drops this database itself.
      PYTEST_ADDOPTS: --db-url=postgresql+psycopg://aipress24:aipress24@postgres/aipress24_test
    depends_on:
      postgres:
        condition: service_healthy
